<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Note - PK PNT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>RELEASE NOTES</h1>
            <div style="color: #64748b; font-size: 13px; margin-top: 5px;">Thông tin cập nhật hệ thống HIS</div>
            <div class="release-meta">
                <div class="select-wrapper">
                    <label for="versionSelect" class="select-label">Phiên bản</label>
                    <div class="custom-select-container">
                        <select id="versionSelect" onchange="handleVersionChange()"></select>
                    </div>
                    <!-- <span>Ngày cập nhật: <span id="display-date">04/03/2026</span></span> -->
                    <span id="updateTimeDisplay"></span>
                </div>   
            </div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Tìm theo Jira, Nội dung...">
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active uat" onclick="showTab(event, 'uat-content')">Môi trường UAT</button>
        <button class="tab-btn prod" onclick="showTab(event, 'prod-content')">Môi trường PRODUCT</button>
    </div>

    <div id="uat-content" class="content active">
        <table id="uatTable">
            <thead>
                <tr>
                    <th style="width: 50px;">STT</th>
                    <th>Nội dung thay đổi</th>
                    <th style="width: 250px;">Jira Ticket</th>
                    <th>Ghi chú</th>
                </tr>
            </thead>
            <tbody id="tableUATBody">
            </tbody>
        </table>
    </div>

    <div id="prod-content" class="content">
        <table id="prodTable">
            <thead>
                <tr>
                    <th style="width: 50px;">STT</th>
                    <th>Nội dung thay đổi</th>
                    <th style="width: 250px;">Jira Ticket</th>
                    <th>Ghi chú</th>
                </tr>
            </thead>
            <tbody id="tablePROBody">
            </tbody>
        </table>
    </div>
    
    <div id="noResult" class="no-result">Không tìm thấy thông tin phù hợp...</div>
    <div class="footer-warning">
        <div class="warning-icon">⚠️</div>
        <div class="warning-text">
            WARNING: Cần người dùng thao tác lại (đăng nhập lại, clear cache UI) để đảm bảo các thay đổi được áp dụng chính xác.
        </div>
    </div>
	

</div>

<script src="script.js"></script>
</body>
</html>
